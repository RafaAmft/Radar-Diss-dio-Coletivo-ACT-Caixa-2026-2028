name: Monitoramento Diário Dissídio Caixa TST

on:
  schedule:
    # Executa todos os dias às 09:00 UTC (06:00 horário de Brasília)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite execução manual pelo botão no GitHub

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          pip install requests beautifulsoup4

      - name: Executar Varredura no TST
        run: |
          python scraping_dissidio_coletivo_greve/monitor_diario_tst.py

      - name: Commit e Push das Atualizações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add monitoramento_diario_caixa.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bot): atualizacao diaria do andamento do dissidio Caixa no TST" && git push)
